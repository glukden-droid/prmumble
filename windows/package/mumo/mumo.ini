; mumo: moves players into their team and squad channels.
; Run from this folder (start.bat does it).

[ice]
host = 127.0.0.1
; must match the ice= port in ..\mumble-server.ini
port = 6504
slice = ..\MumbleServer.ice
secret = prmurmurpassword
watchdog = 15

[murmur]
; empty: every virtual server
servers =

[modules]
mod_dir = modules/
cfg_dir = modules-enabled/
timeout = 2

[system]
pidfile = mumo.pid

[log]
; 30 = WARNING; 10 = DEBUG (shows every move)
level = 30
file = mumo.log

[iceraw]
Ice.ThreadPool.Server.Size = 5
