; Mumble server 1.5.857 (PR build) - Windows package.
; Paths are relative to this file's folder.

database=murmur.sqlite

; Ice stays on the loopback, mumo connects here. The port must match
; mumo\mumo.ini. Ice listens on 127.0.0.1 only, so the default secret is
; fine; if you change it, change it in both files.
ice="tcp -h 127.0.0.1 -p 6504"
icesecretread=prmurmurpassword
icesecretwrite=prmurmurpassword

[Ice]
Ice.Warn.UnknownProperties=1
Ice.MessageSizeMax=65536

[General]
port=64740
host=

welcometext="Welcome to Project Reality Mumble"
bandwidth=40000
timeout=30
users=1000

; Lobby is channel 1 once setup-channels.bat has run.
defaultchannel=1
rememberchannel=false

; Channel listeners on; the PR client (1.3) shows a privacy warning for it.
; Who may listen is decided by the ACL (bots and admins only).
listenersperchannel=-1
listenersperuser=-1

autobanAttempts=5
autobanTimeframe=60
autobanTime=120

logfile=mumble-server.log
logdays=-1
