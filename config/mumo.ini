; mumo: the bot that moves players into team and squad channels.
;
; The Ice port must match mumble-server.ini. These are the TEST values; set
; 6504 before the switch.

[ice]
host = 127.0.0.1
port = 6504
slice = /usr/share/MumbleServer.ice
secret = CHANGE_ME_ice_secret
watchdog = 15

[murmur]
; empty: every virtual server
servers =

[modules]
mod_dir = /opt/mumo/modules/
cfg_dir = /data/mumo/modules-enabled/
timeout = 2

[system]
pidfile = /data/mumo/mumo.pid

[log]
; 30 = WARNING; use 10 while testing to watch players being moved
level = 30
file = /data/logs/mumo.log

[iceraw]
Ice.ThreadPool.Server.Size = 5
