; Mumble server 1.5 for Project Reality. Carried over from the old
; prmurmur.ini; only paths and the two ports differ.
;
; PORTS: production values (64740, Ice 6504); the Ice port must match
; mumo.ini.

database=/data/murmur.sqlite

; Ice stays on the loopback: the container runs with network_mode host, so
; anything listening on 0.0.0.0 would be open to the world.
ice="tcp -h 127.0.0.1 -p 6504"
icesecretread=CHANGE_ME_ice_secret
icesecretwrite=CHANGE_ME_ice_secret

[Ice]
Ice.Warn.UnknownProperties=1
Ice.MessageSizeMax=65536

[General]
port=64740
host=

welcometext="Welcome to another Project Reality Mumble server"
bandwidth=40000
timeout=30
users=1000

; The channel the Mumble plugin pulls players out of; prbf2.ini numbers the
; rest. Do not renumber channels, those numbers live in the database.
defaultchannel=1
rememberchannel=false

; Channel listeners (Mumble 1.4+) are invisible to the 1.3 client PR ships,
; so the server warns every player that someone may listen unseen. Kept on
; (-1 = unlimited) on purpose; the warning is accepted. Who may listen is
; set by ACL: Listen is denied in team/squad channels for everyone except
; admins (Write on Root implies every permission).
listenersperchannel=-1
listenersperuser=-1

autobanAttempts=5
autobanTimeframe=60
autobanTime=120

logfile=/data/logs/mumble-server.log
logdays=-1
pidfile=/data/mumble-server.pid
